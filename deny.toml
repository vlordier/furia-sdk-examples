# cargo-deny configuration for Furia Rust crates
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "OpenSSL",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/vlordier/furia-core"]