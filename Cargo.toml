[workspace]
resolver = "2"
members = [
    "sensors/*",
    "entities/*",
    "intelligence/*",
    "operations/*",
    "governance/*",
    "integrations/*",
    "cuas/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = { level = "forbid" }

[workspace.dependencies]
# Pin the SDK API revision so CI builds without a sibling furia-core checkout.
furia-sdk = { version = "0.1.0", git = "https://github.com/vlordier/furia-core.git", rev = "84595d7e1c515703511b3d1344ed49c7d37602eb" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
